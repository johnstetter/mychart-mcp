[project]
name = "mychart-mcp"
version = "0.1.0"
description = "Read-only MCP server over a local copy of your MyChart (Epic) health records"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "John Stetter" }]
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
mychart-mcp = "mychart_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mychart_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
